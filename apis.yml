aid: newoldstamp
name: Newoldstamp
description: Newoldstamp is an email signature management platform that lets companies
  create, brand, and centrally manage professional email signatures across their teams.
  It provides a signature generator with customizable templates, department- and role-based
  signature deployment, email signature marketing banners and campaigns, click analytics,
  and integrations with Google Workspace, Microsoft 365, and popular email clients.
  Newoldstamp also operates Pearl Diver, a website-visitor identification product.
  Founded in 2016 and a wholly-owned subsidiary of Blackpearl Group since 2025 (previously
  backed by 500 Global), it serves marketing, sales, and IT teams that want consistent
  branded email signatures at scale. Newoldstamp publishes no documented public developer
  program, but its dashboard is powered by a GraphQL API at newoldstamp.com/api/graphql
  (41 queries, 71 mutations, 4 subscriptions) whose introspection is anonymously open.
